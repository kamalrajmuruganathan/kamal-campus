          grep -q "import gen_extra" scripts/generer-exos.py || \
            sed -i 's|^if __name__ == "__main__":|try:\n    import gen_extra\n    REGISTRE.update(gen_extra.EXTRA)\nexcept Exception as _e:\n    print("[gen_extra non charge]", _e)\n\nif __name__ == "__main__":|' scripts/generer-exos.py
