        run: python3 scripts/generer-exos.py
      - name: Preparer l'index + controle qualite
        working-directory: app
        run: |
          npm ci || npm install
          npm run preparer
          npm run qualite
      - name: Commit + push sur main
        run: |
          git config user.name "kamal-campus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f app/src/contenu-index.js app/src/visionneuse.js
          git add contenu scripts/gen_extra.py scripts/generer-exos.py
