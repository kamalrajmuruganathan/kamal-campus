name: Publier sur GitHub Pages

# Publie le site (vitrine + appli web) à chaque mise à jour de main,
# ou à la demande (onglet Actions → « Publier sur GitHub Pages » → Run workflow).
# Adresse : https://kamalrajmuruganathan.github.io/kamal-campus/
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances de l'appli
        working-directory: app
        run: npm ci

      - name: Exporter l'appli web (baseUrl /kamal-campus/app, réglé dans app.json)
        working-directory: app
        run: npx expo export --platform web

      - name: Assembler le site (vitrine à la racine, appli dans /app)
        run: |
          set -e
          rm -rf site && mkdir -p site/app
          cp web-vitrine/*.html site/
          cp -r app/dist/* site/app/
          touch site/.nojekyll site/app/.nojekyll
          echo "Site assemblé : $(find site -type f | wc -l) fichiers"

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
