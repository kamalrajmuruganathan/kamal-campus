name: Déployer Kamal Campus (site + appli web)

on:
  push:
    branches: [ upgrade-sdk57 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances (appli)
        working-directory: app
        continue-on-error: true
        run: npm ci || npm install

      - name: Exporter la version web (appli)
        working-directory: app
        continue-on-error: true
        run: npx expo export --platform web

      - name: Assembler le site (vitrine + appli si dispo)
        run: |
          set -e
          mkdir -p site
          cp web-vitrine/*.html site/
          touch site/.nojekyll
          if [ -d app/dist ] && [ -n "$(ls -A app/dist 2>/dev/null)" ]; then
            mkdir -p site/app
            cp -r app/dist/* site/app/
            touch site/app/.nojekyll
            echo "Vitrine + appli web assemblees."
          else
            echo "Appli web pas encore exportee -> vitrine seule (normal en Phase A)."
          fi
          echo "Contenu du site :" && find site -maxdepth 2 -type f | sort

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
