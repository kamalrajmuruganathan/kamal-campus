<title>Bientôt · Kamal Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --paper:#f6f4ec; --paper-card:#fffdf8; --ink:#16243a; --ink-soft:#4a5a70;
    --line:#dcd8c9; --grid:rgba(31,111,235,.055); --blue:#1f6feb; --blue-deep:#0b3f9e;
    --blue-tint:#e7f0ff; --craie:#ff6b45;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --paper:#0d1725; --paper-card:#14243a; --ink:#eaf1fb; --ink-soft:#9fb2cc;
    --line:#22344e; --grid:rgba(84,150,255,.07); --blue:#4f95ff; --blue-deep:#9cc2ff;
    --blue-tint:#14294a; --craie:#ff7d5c;
  } }
  :root[data-theme="dark"] {
    --paper:#0d1725; --paper-card:#14243a; --ink:#eaf1fb; --ink-soft:#9fb2cc;
    --line:#22344e; --grid:rgba(84,150,255,.07); --blue:#4f95ff; --blue-deep:#9cc2ff;
    --blue-tint:#14294a; --craie:#ff7d5c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px; line-height:1.6; -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:24px;
  }
  .card {
    max-width:520px; width:100%; text-align:center; background:var(--paper-card);
    border:1px solid var(--line); border-radius:22px; padding:44px 30px;
    box-shadow:18px 22px 48px -28px rgba(16,32,60,.35);
  }
  .logo {
    width:58px; height:58px; border-radius:16px; margin:0 auto 22px;
    background:linear-gradient(145deg,var(--blue),var(--blue-deep));
    display:grid; place-items:center; color:#fff; font-family:"Fraunces",serif; font-weight:900; font-size:1.7rem;
    box-shadow:0 10px 24px -10px var(--blue);
  }
  .tag { font-family:"Figtree",sans-serif; font-size:.76rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--blue-deep); }
  h1 { font-family:"Fraunces",serif; font-weight:900; font-size:2rem; letter-spacing:-.02em; margin:12px 0 0; text-wrap:balance; }
  .hl { position:relative; white-space:nowrap; }
  .hl::after { content:""; position:absolute; left:-2px; right:-2px; bottom:.08em; height:.34em; z-index:-1; background:var(--craie); opacity:.32; border-radius:3px; transform:rotate(-.6deg); }
  p { color:var(--ink-soft); font-size:1.04rem; margin:16px auto 0; max-width:40ch; }
  .btn {
    display:inline-flex; align-items:center; gap:9px; margin-top:28px;
    font-weight:700; font-size:1rem; padding:13px 24px; border-radius:12px;
    background:var(--blue); color:#fff; text-decoration:none;
    box-shadow:0 10px 24px -10px var(--blue); transition:transform .12s ease;
  }
  .btn:hover { transform:translateY(-1px); }
  .sub { margin-top:18px; font-size:.86rem; color:var(--ink-soft); }
  .sub a { color:var(--blue); font-weight:600; }
</style>
<div class="card">
  <div class="logo">K</div>
  <span class="tag">Kamal Campus</span>
  <h1>La version web arrive <span class="hl">très bientôt</span></h1>
  <p>Cette page n'est pas encore disponible. En attendant, tu peux découvrir tout ce que propose Kamal Campus sur la page d'accueil.</p>
  <a class="btn" href="/kamal-campus/">← Retour à l'accueil</a>
  <div class="sub">L'application est aussi en préparation pour <a href="/kamal-campus/">Android &amp; iPhone</a>.</div>
</div>
<script>
  (function(){
    var root=document.documentElement, saved;
    try{ saved=localStorage.getItem('kc-theme'); }catch(e){}
    if(saved==='dark'||saved==='light') root.setAttribute('data-theme',saved);
  })();
</script>
